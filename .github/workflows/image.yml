# Builds the STRINGER image on every push to main and publishes it to GitHub's container registry:
#   ghcr.io/ofaolin/stringer:latest   (and :sha-<commit>)
# for arm64 (Apple Silicon / Raspberry Pi servers) and amd64. Servers that run :latest under Watchtower pick up
# each new build on their next poll — so the image is started and checked here first, and a build that doesn't
# come up healthy is never pushed.
#
# Actions are pinned to commit SHAs (this job can write packages); the comment names the release. To update one:
#   git ls-remote --tags https://github.com/<owner>/<action>.git
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # 1. build for this runner (amd64) and load it into the local Docker, without pushing
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: stringer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. start it on an empty data volume and require it to come up: /api/health answers and the setup wizard loads
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 1337:1337 -e BACKFILL=0 stringer:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:1337/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:1337/api/health >/dev/null
          curl -fsS -o /dev/null http://127.0.0.1:1337/
          test "$(docker inspect -f '{{.State.Running}}' smoke)" = true
      - name: Container log
        if: always()
        run: docker logs smoke 2>&1 | tail -n 100 || true

      # 3. only then publish both architectures (amd64 comes from the cache)
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/stringer
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
